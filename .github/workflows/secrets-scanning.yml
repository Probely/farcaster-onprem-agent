name: Detect Secrets
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-pr-without-secrets:
    name: Scan PR without secrets
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The base commit owns the scanner rules and ignore list.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          printf '%s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "${HEAD_SHA}"
          "${RUNNER_TEMP}/gitleaks" git --redact --ignore-gitleaks-allow --log-opts="-m ${BASE_SHA}..${HEAD_SHA}"

  secrets-scan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
      pull-requests: write # Gitleaks comments on findings in same-repository PRs.
    uses: probely/snyk-prodsec/.github/workflows/secrets-scanning.yml@ac78426a1294c4c352d568dec58aa2ed731e678f # main
    with:
      channel: probely-alerts
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_SECRET }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
